name: harassment-defense-dev
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "127.0.0.1:18088:8080"
    volumes:
      - hd-dev-private:/app/private
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
  research-worker:
    build: .
    restart: unless-stopped
    env_file: .env.dev
    command: ["python", "worker.py"]
    volumes:
      - hd-dev-private:/app/private
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
volumes:
  hd-dev-private:
