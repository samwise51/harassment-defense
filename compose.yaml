services:
  harassment-defense:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./private:/app/private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
  research-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "worker.py"]
    volumes:
      - ./private:/app/private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
